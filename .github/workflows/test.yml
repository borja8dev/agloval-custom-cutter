# Runs lint + backend + frontend tests on every push/PR to main.
# Cypress E2E is intentionally NOT run here: frontend/package.json has no
# server-orchestration script (e.g. start-server-and-test) to boot both dev
# servers non-interactively in CI, and `test:e2e` opens Cypress's interactive
# GUI (`cypress open`) rather than a headless run. Run E2E locally via
# `cd frontend && npm run test:e2e:headless` (see docs/TROUBLESHOOTING.md).
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install backend deps
        run: npm install
        working-directory: backend
      - name: Install frontend deps
        run: npm install
        working-directory: frontend
      - name: Lint backend
        run: npm run lint
        working-directory: backend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: agloval
          POSTGRES_PASSWORD: agloval
          POSTGRES_DB: agloval_cutting_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agloval"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://agloval:agloval@localhost:5432/agloval_cutting_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm install
        working-directory: backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: backend
      - name: Run backend tests
        run: npm test
        working-directory: backend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm install
        working-directory: frontend
      - name: Run frontend unit tests
        run: npm test -- --run
        working-directory: frontend
