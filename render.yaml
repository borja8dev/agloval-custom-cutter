databases:
  - name: agloval-custom-cutter-db
    databaseName: agloval_cutting
    user: agloval
    plan: free # verify current plan slugs in the Render dashboard — names/tiers change over time

services:
  - type: web
    name: agloval-custom-cutter-backend
    runtime: node
    rootDir: backend
    plan: free # same caveat as above
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agloval-custom-cutter-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # set manually once the Vercel frontend URL is known — see docs/DEPLOYMENT.md
      # Order emails (docs/DEPLOYMENT.md). Without SMTP_HOST emails are only logged.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Leave unset until Agloval decides which address receives orders.
      - key: ORDER_NOTIFICATION_EMAIL
        sync: false
