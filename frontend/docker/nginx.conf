server {
  listen 80;
  root /usr/share/nginx/html;

  # The API lives in the backend container; same origin for the browser, so no CORS surprises.
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Single-page app: /presupuestos, /pedidos and unknown routes are handled by React Router.
  location / {
    try_files $uri /index.html;
  }
}
