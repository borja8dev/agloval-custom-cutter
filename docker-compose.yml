version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: agloval_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: agloval_user
      POSTGRES_PASSWORD: agloval_password
      POSTGRES_DB: agloval_cutting_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agloval_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agloval-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agloval_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agloval.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - agloval-network

volumes:
  postgres_data:

networks:
  agloval-network:
    driver: bridge
